pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript text/plain text/xml application/javascript application/json application/manifest+json application/rss+xml application/xml image/svg+xml;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /home/container/nginx/*.conf;
}
