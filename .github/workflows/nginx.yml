name: nginx

on:
  push:
    branches: [main]
    paths:
      - nginx/**
      - .github/workflows/nginx.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: yolks:nginx_${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: static
            file: Dockerfile
            php: ""
          - variant: php8.5
            file: php.Dockerfile
            php: "8.5"
          - variant: php8.4
            file: php.Dockerfile
            php: "8.4"
          - variant: php8.3
            file: php.Dockerfile
            php: "8.3"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/${{ matrix.file }}
          build-args: PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=nginx_${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=nginx_${{ matrix.variant }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/artiomshosting/yolks:nginx_${{ matrix.variant }}
            ghcr.io/artiomshosting/yolks:nginx_${{ matrix.variant }}-${{ steps.date.outputs.today }}
