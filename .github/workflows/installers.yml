name: installers

on:
  push:
    branches: [main]
    paths:
      - installers/**
      - .github/workflows/installers.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: yolks:installer_${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./installers/${{ matrix.distro }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=installer_${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=installer_${{ matrix.distro }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/artiomshosting/yolks:installer_${{ matrix.distro }}
            ghcr.io/artiomshosting/yolks:installer_${{ matrix.distro }}-${{ steps.date.outputs.today }}
